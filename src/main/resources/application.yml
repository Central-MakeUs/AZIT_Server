spring:
  profiles:
    active: local
  application:
    name: azit

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  jackson:
    deserialization:
      read_unknown_enum_values_as_null: true

security:
  permit-all-paths:
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/api/v1/swagger-test/**"

oauth:
  kakao:
    auth-url: https://kauth.kakao.com
    api-url: https://kapi.kakao.com
  apple-url: https://appleid.apple.com

default:
  member:
    profile-images:
      - "/default/members/default_1.svg"
      - "/default/members/default_2.svg"
      - "/default/members/default_3.svg"
      - "/default/members/default_4.svg"
      - "/default/members/default_5.svg"
      - "/default/members/default_6.svg"
  crew:
    image: "/default/crews/crew_default.svg"

management:
  endpoints:
    web:
      exposure:
        include: health # 무중단 배포에 필요한 health 엔드포인트만 노출
  endpoint:
    health:
      show-details: never # 서버 내부 정보(DB 상태, 디스크 용량 등)를 숨기고 "UP/DOWN" 결과만 보여줌
