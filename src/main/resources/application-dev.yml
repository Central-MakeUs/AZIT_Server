spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: dev-azit-storage
      cloudfront:
        domain: dev-images.azitcrew.com
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}

swagger:
  server:
    url: https://dev-api.azitcrew.com
    description: Develop Server

server:
  port: 8080