spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379

cloud:
  aws:
    s3:
      bucket: prod-azit-storage
    cloudfront:
      domain: images.azitcrew.com
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
    region:
      static: ap-northeast-2

# 서버 포트 (도커 컨테이너 내부 포트)
server:
  port: 8080